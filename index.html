<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>生日快乐 🎂</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { min-height:100vh; overflow:hidden; font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
         background:linear-gradient(135deg,#fff5f8,#ffe9f2 30%,#fff7ec 65%,#eafaff);
         background-size:300% 300%; animation:bgmove 12s ease infinite; }
  @keyframes bgmove { 0%,100%{background-position:0% 50%} 50%{background-position:100% 50%} }
  .balloon { position:fixed; bottom:-90px; z-index:0; font-size:34px; opacity:.9; animation:float linear infinite; will-change:transform; }
  @keyframes float { 0%{ transform:translate(0,0) rotate(-4deg);} 25%{ transform:translate(22px,-28vh) rotate(5deg);} 50%{ transform:translate(-14px,-55vh) rotate(-5deg);} 75%{ transform:translate(18px,-80vh) rotate(4deg);} 100%{ transform:translate(0,-115vh) rotate(-3deg);} }
  .spark { position:fixed; width:6px; height:6px; border-radius:50%; background:#ffd34d; z-index:0; animation:twinkle 2.2s ease-in-out infinite; }
  @keyframes twinkle { 0%,100%{opacity:0; transform:scale(.6);} 50%{opacity:1; transform:scale(1.2);} }
  .card { position:relative; z-index:2; max-width:430px; width:calc(100% - 28px); margin:24px auto;
          background:rgba(255,255,255,.72); backdrop-filter:blur(14px); border-radius:26px;
          box-shadow:0 16px 44px rgba(255,120,160,.25); padding:26px 20px 30px; text-align:center; }
  .confetti-t { font-size:26px; letter-spacing:6px; color:#ffb6c9; }
  .title { font-size:44px; font-weight:900; background:linear-gradient(90deg,#ff6b9d,#ff9a3d,#ff6b9d);
           background-size:200% auto; -webkit-background-clip:text; background-clip:text; color:transparent;
           animation:shine 3s linear infinite; margin-top:2px; }
  @keyframes shine { to { background-position:200% center; } }
  .sub { margin-top:6px; font-size:14px; color:#a98899; letter-spacing:1px; }
  .song { margin-top:14px; font-size:12px; color:#c78ba3; letter-spacing:1px; }
  .disc { width:132px; height:132px; margin:18px auto 6px; border-radius:50%; position:relative;
          background:repeating-radial-gradient(circle,#3a3a3a 0 3px,#191919 3px 6px);
          box-shadow:0 12px 30px rgba(0,0,0,.22); }
  .disc .label { position:absolute; inset:0; margin:auto; width:58px; height:58px; border-radius:50%;
                 background:linear-gradient(135deg,#fff,#ffe3ee); font-size:30px; line-height:58px;
                 box-shadow:0 0 0 5px rgba(255,255,255,.9); }
  .disc.spin { animation:spin 4s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .lyrbox { position:relative; height:118px; margin:14px auto 4px; overflow:hidden; width:100%; }
  .lyrbox::before, .lyrbox::after { content:""; position:absolute; left:0; right:0; height:34px; z-index:2; pointer-events:none; }
  .lyrbox::before { top:0; background:linear-gradient(#fffdf9,transparent); }
  .lyrbox::after { bottom:0; background:linear-gradient(transparent,#fffdf9); }
  #lyrWrap { transition:transform .55s cubic-bezier(.2,.7,.2,1); }
  .lyrline { height:44px; line-height:44px; font-size:15px; color:#b995a6; opacity:.3; transform-origin:center;
             transition:opacity .4s, color .4s; white-space:nowrap; }
  .lyrline.on { opacity:1; color:#ff5e8a; font-weight:700; font-size:18px; }
  .eq { display:flex; align-items:flex-end; justify-content:center; gap:4px; height:22px; margin:8px auto 14px; }
  .eq i { width:5px; height:8px; border-radius:3px; background:linear-gradient(#ff9a3d,#ff5e8a); }
  .eq.on i { animation:eqbar 1s ease-in-out infinite; }
  .eq.on i:nth-child(2){ animation-delay:.15s } .eq.on i:nth-child(3){ animation-delay:.3s }
  .eq.on i:nth-child(4){ animation-delay:.1s } .eq.on i:nth-child(5){ animation-delay:.25s }
  @keyframes eqbar { 0%,100%{ height:8px; } 50%{ height:20px; } }
  .playbtn { width:88px; height:88px; border-radius:50%; border:none; cursor:pointer; position:relative;
             background:linear-gradient(135deg,#ff7ba6,#ff9a5a); color:#fff; font-size:34px;
             box-shadow:0 10px 24px rgba(255,110,150,.4); display:flex; align-items:center; justify-content:center; margin:0 auto; }
  .playbtn::after { content:""; position:absolute; inset:-8px; border-radius:50%; border:2px solid rgba(255,120,160,.5); opacity:0; }
  .playing .playbtn::after { animation:ring 1.6s ease-out infinite; }
  @keyframes ring { 0%{ transform:scale(.9); opacity:1; } 100%{ transform:scale(1.45); opacity:0; } }
  .playbtn:active { transform:scale(.93); }
  .hint { margin-top:12px; font-size:12px; color:#c39bab; letter-spacing:1px; }
  .foot { margin-top:6px; font-size:11px; color:#d6bcc6; letter-spacing:1px; }
</style>
</head>
<body>
  <div class="card">
    <div class="confetti-t">🎉 🎊 🎈</div>
    <h1 class="title">生日快乐</h1>
    <!-- 想写名字？把下面这行"小寿星"三个字改成名字即可 -->
    <p class="sub">小寿星·愿你欣欣向荣✨</p>
    <div class="disc" id="disc"><div class="label">🎂</div></div>
    <p class="song">正在播放：野心家 · 张靓颖（《灼灼韶华》主题曲）</p>

    <div class="lyrbox"><div id="lyrWrap"></div></div>

    <div class="eq" id="eq"><i></i><i></i><i></i><i></i><i></i></div>
    <button class="playbtn" id="btn" aria-label="播放">▶</button>
    <p class="hint" id="hint">轻点播放，解锁新年新快乐🎵</p>
  </div>
  <audio id="audio" src="song.mp3" preload="auto"></audio>

<script>
/* ============ 滚动歌词 / 祝福语 ============
   想改成歌曲的真正歌词？把下面的内容替换成：
   [开始秒数, "歌词文字"],
   例：[5.5, "第一句歌词"],
*/
var LYRICS = [
  [1,  "🎂 祝你生日快乐 🎂"],
  [5,  "愿你的笑容像阳光一样灿烂"],
  [9,  "愿你的每一天都闪闪发光 ✨"],
  [13, "有梦就去追，有爱就拥抱"],
  [17, "所有的美好都奔你而来 🎈"],
  [21, "愿你不慌不忙，慢慢长大"],
  [25, "把日子过成喜欢的样子 🌸"],
  [29, "生日快乐，天天快乐！🎉"]
];

/* ---------- 气球与星光 ---------- */
(function(){
  var emoji = ["🎈","🎈","🎈","🎀","🎉","🌸","🍕"];
  for (var i=0;i<9;i++){
    var b=document.createElement('div'); b.className='balloon'; b.textContent=emoji[i%emoji.length];
    b.style.left=(Math.random()*96+2)+'%'; b.style.fontSize=(26+Math.random()*22)+'px';
    b.style.animationDuration=(9+Math.random()*10)+'s'; b.style.animationDelay=(-Math.random()*10)+'s';
    document.body.appendChild(b);
  }
  for (var j=0;j<14;j++){
    var s=document.createElement('div'); s.className='spark';
    s.style.left=(Math.random()*98)+'%'; s.style.top=(Math.random()*98)+'%';
    s.style.animationDelay=(-Math.random()*3)+'s'; document.body.appendChild(s);
  }
})();

/* ---------- 播放器 ---------- */
var audio=document.getElementById('audio'), btn=document.getElementById('btn'),
    disc=document.getElementById('disc'), eq=document.getElementById('eq'),
    hint=document.getElementById('hint'), wrap=document.getElementById('lyrWrap'), playing=false;

LYRICS.forEach(function(x){ var p=document.createElement('p'); p.className='lyrline'; p.textContent=x[1]; wrap.appendChild(p); });

function setActive(i){
  var lines=wrap.children;
  for(var k=0;k<lines.length;k++) lines[k].classList.toggle('on', k===i);
  var lineH=44, boxH=wrap.parentElement.clientHeight;
  wrap.style.transform='translateY('+(boxH/2-(i*lineH+lineH/2))+'px)';
}
function curLine(){ var t=audio.currentTime, idx=0;
  for(var i=0;i<LYRICS.length;i++){ if(t>=LYRICS[i][0]) idx=i; } return idx; }
audio.addEventListener('timeupdate', function(){ setActive(curLine()); });

function set(on){ playing=on; btn.textContent=on?'❚❚':'▶'; disc.classList.toggle('spin',on);
  eq.classList.toggle('on',on); document.body.classList.toggle('playing',on);
  hint.textContent=on?'正在播放，祝你生日快乐 🎶':'轻点按钮，解锁新快乐 🎵'; }
function tryPlay(){ var p=audio.play();
  if(p&&p.then){ p.then(function(){set(true); setActive(0);}).catch(function(){set(false);}); } }
tryPlay();
btn.addEventListener('click', function(){ if(playing){ audio.pause(); set(false); } else { tryPlay(); } });
audio.addEventListener('ended', function(){ set(false); });
window.addEventListener('load', function(){ setActive(0); });
</script>
</body>
</html>
